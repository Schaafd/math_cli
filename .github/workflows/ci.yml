name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[all,test,dev]"
      - name: Syntax and focused lint
        run: |
          python -m compileall -q math_cli.py cli core plugins utils
          ruff check . --select E9,F63,F7,F82
      - name: Focused type check
        run: mypy --ignore-missing-imports --follow-imports=skip math_cli.py math_cli_app utils/serialization.py utils/lazy_import.py
      - name: Security scan
        run: bandit -q -r math_cli.py cli core plugins utils -x tests -s B110,B307
      - name: Tests and coverage
        run: pytest

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel and smoke-test console scripts
        run: |
          python -m venv /tmp/math-cli-smoke
          /tmp/math-cli-smoke/bin/pip install dist/*.whl
          /tmp/math-cli-smoke/bin/math add 2 3
          /tmp/math-cli-smoke/bin/math-cli "7 + 9 * 2"
          /tmp/math-cli-smoke/bin/math --list-plugins
