[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "math-cli"
version = "0.3.0"
description = "A modular command-line calculator with plugin support for mathematical operations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=14.0.0,<15",
    "prompt_toolkit>=3.0.0,<4",
    "psutil>=5.9.0,<8",
]

[project.optional-dependencies]
scientific = [
    "numpy>=1.24.0,<3",
    "scipy>=1.10.0,<2",
    "sympy>=1.12,<2",
]
data = [
    "numpy>=1.24.0,<3",
    "pandas>=2.0.0,<4",
]
plot = [
    "numpy>=1.24.0,<3",
    "scipy>=1.10.0,<2",
    "sympy>=1.12,<2",
    "pandas>=2.0.0,<4",
    "matplotlib>=3.7.0,<4",
    "seaborn>=0.12.0,<1",
]
all = [
    "numpy>=1.24.0,<3",
    "scipy>=1.10.0,<2",
    "sympy>=1.12,<2",
    "pandas>=2.0.0,<4",
    "matplotlib>=3.7.0,<4",
    "seaborn>=0.12.0,<1",
]
test = [
    "pytest>=7.0.0,<10",
    "pytest-cov>=4.0.0,<8",
]
dev = [
    "bandit>=1.8.0,<2",
    "build>=1.2.0,<2",
    "mypy>=1.15.0,<2",
    "ruff>=0.12.0,<1",
]

[project.scripts]
math = "math_cli_app:main"
math-cli = "math_cli_app:main"

[tool.setuptools]
py-modules = ["math_cli"]
packages = ["math_cli_app", "cli", "core", "plugins", "utils"]

[project.urls]
Repository = "https://github.com/Schaafd/math_cli"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["math_cli_orig.py"]
